<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idle Hub — Runebound & Lineage</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌌</text></svg>" />
  <link rel="stylesheet" href="/src/hub/hub.css" />
</head>
<body>
  <div class="hub-shell">
    <header class="hub-header">
      <div class="hub-brand">
        <span class="hub-logo">🌌</span>
        <div>
          <h1>IDLE REALMS HUB</h1>
          <p class="hub-tagline">One workshop, multiple worlds — saves stay right in your browser &amp; cloud</p>
        </div>
      </div>
      <div id="hub-account" class="hub-account">Checking session…</div>
    </header>

    <main class="hub-main">
      <section class="hub-section-head">
        <h2>Select a Project</h2>
        <span id="hub-build" class="hub-build"></span>
      </section>

      <div id="hub-grid" class="hub-grid">
        <!-- Populated dynamically by src/hub/main.js with live save stats -->
      </div>
    </main>

    <footer class="hub-footer">
      <span>Local saves persist automatically per game (<code>runebound-save-v1</code> &amp; <code>lifesim-save-v1</code>).</span>
    </footer>
  </div>

  <script type="module" src="/src/hub/main.js"></script>
</body>
</html>
